<ion-header class="ion-no-border">
  <ion-toolbar>
      <ion-title>Lançamento Manual</ion-title>
      <ion-buttons slot="end">
          <ion-button (click)="cancel()">
              <ion-icon name="close-outline"></ion-icon>
          </ion-button>
      </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-container">
      <p class="description-text">Insira um extrato manualmente para conciliação.</p>

      <ion-item fill="outline" class="input-item">
          <ion-label position="stacked">Data *</ion-label>
          <ion-input type="date" [(ngModel)]="data"></ion-input>
      </ion-item>

      <ion-item fill="outline" class="input-item">
          <ion-label position="stacked">Descrição *</ion-label>
          <ion-input type="text" [(ngModel)]="descricao" placeholder="Ex: Ajuste de Saldo"></ion-input>
      </ion-item>

      <div class="transaction-type-segment">
          <ion-segment [(ngModel)]="tipo" mode="ios">
              <ion-segment-button value="CREDIT" class="segment-credit">
                  <ion-label>Receita (+)</ion-label>
              </ion-segment-button>
              <ion-segment-button value="DEBIT" class="segment-debit">
                  <ion-label>Despesa (-)</ion-label>
              </ion-segment-button>
          </ion-segment>
      </div>

      <ion-item fill="outline" class="input-item">
          <ion-label position="stacked">Valor (R$) *</ion-label>
          <ion-input type="text" [value]="valor" (ionInput)="formatCurrency($event)" placeholder="0,00"></ion-input>
      </ion-item>
      <div class="actions">
          <ion-button expand="block" (click)="save()" [disabled]="!isValid()" color="primary">
              {{ statement ? 'Salvar Alterações' : 'Adicionar' }}
          </ion-button>
      </div>
  </div>
</ion-content>
